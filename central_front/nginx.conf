server {
    listen 80;
    server_name localhost;

    # 1. Servir los archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial para Single Page Applications (React Router)
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy para el Backend en Elixir Phoenix
    location /api/ {
        # 'backend' es el nombre del servicio en docker-compose.yml
        proxy_pass http://backend:4000/;
        
        # Encabezados HTTP estándar para preservar la información del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets (si usas Phoenix Channels/LiveView)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Manejo de errores de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
