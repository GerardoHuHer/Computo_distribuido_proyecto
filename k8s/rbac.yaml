apiVersion: v1
kind: ServiceAccount
metadata:
  name: erl-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erl-cluster
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erl-cluster
subjects:
  - kind: ServiceAccount
    name: erl-cluster
roleRef:
    kind: Role
    name: erl-cluster
    apiGroup: rbac.authorization.k8s.io