apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-rover
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-rover }
  template:
    metadata:
      labels:
        { app: db-rover }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: db-rover, key: user } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: db-rover, key: password } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: db-rover, key: db } } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: db-rover
spec:
  selector: { app: db-rover }
  ports:
    - { port: 5432, targetPort: 5432 }
