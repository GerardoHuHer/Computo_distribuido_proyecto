apiVersion: v1
kind: Service # Tipo de servicio que se va a crear o gestionar en el cluster
metadata:
  name: backend-central
  labels:
    app: backend-central
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: backend-central }
  ports:
    - { name: epmd, port: 4369 }
    - { name: dist, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backend-central
spec:
  serviceName: backend-central
  replicas: 3
  selector:
    matchLabels: { app: backend-central }
  template:
    metadata:
      labels: { app: backend-central }
    spec:
      serviceAccountName: erl-cluster
      initContainers:
        - name: wait-db
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h db-central -p 5432; do sleep 2; done"]
      containers:
        - name: backend-central
          image: backend-central:latest
          imagePullPolicy: Never
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: RELEASE_COOKIE, valueFrom: { secretKeyRef: { name: erl-cookie, key: cookie } } }
            - { name: SECRET_KEY_BASE, valueFrom: { secretKeyRef: { name: phx-secret, key: secret_key_base } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: db-central, key: user } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: db-central, key: password } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: db-central, key: db } } }
            - { name: DB_HOST, value: db-central }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: ssl-dist, mountPath: /tls, readOnly: true }

      volumes:
        - name: certs
          secret: { secretName: tls-central }
        - name: ssl-dist
          configMap: { name: ssl-dist }

              