services:
  # ----------------------------------------------------
  # Central
  # ----------------------------------------------------
  db_central:
    image: postgres:18-alpine
    container_name: postgres_central
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_central:
    container_name: backend_central
    build:
      context: ./central/
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:4000"
    depends_on:
      db_central:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}

  test_central: 
    build: 
      context: ./central/
      dockerfile: Dockerfile
    command: ["mix", "test"]
    depends_on: 
      db_central: 
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
    profiles: ["test"]

  # ----------------------------------------------------
  # Vehiculo
  # ----------------------------------------------------
  db_vehiculo1:
    image: postgres:18-alpine
    container_name: postgres_vehiculo1
    environment:
      POSTGRES_USER: ${ROVER1_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ROVER1_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROVER1_POSTGRES_DB}
    ports:
      - "${ROVER1_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROVER1_POSTGRES_USER} -d ${ROVER1_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_vehiculo1: 
    container_name: backend_vehiculo1
    build:
      context: ./rover/
      dockerfile: Dockerfile
    ports:
      - "${ROVER1_BACKEND_PORT}:4000"
    depends_on:
      db_vehiculo1:
        condition: service_healthy
    environment:
      - ROVER1_POSTGRES_PASSWORD=${ROVER1_POSTGRES_PASSWORD}
      - ROVER1_POSTGRES_USER=${ROVER1_POSTGRES_USER}
      - ROVER1_POSTGRES_DB=${ROVER1_POSTGRES_DB}
      - ROVER1_DB_HOST=${ROVER1_DB_HOST}

  test_vehiculo1: 
    build: 
      context: ./rover/
      dockerfile: Dockerfile
    command: ["mix", "test"]
    depends_on: 
      db_vehiculo1: 
        condition: service_healthy
    environment:
      - ROVER1_POSTGRES_PASSWORD=${ROVER1_POSTGRES_PASSWORD}
      - ROVER1_POSTGRES_USER=${ROVER1_POSTGRES_USER}
      - ROVER1_POSTGRES_DB=${ROVER1_POSTGRES_DB}
      - ROVER1_DB_HOST=${ROVER1_DB_HOST}
    profiles: ["test"]

  # ----------------------------------------------------
  # Frontend 
  # ----------------------------------------------------
  frontend:
    container_name: frontend_central
    build:
      context: ./central_front/
      dockerfile: Dockerfile
    ports:
      - "80:80" 
    depends_on:
      - backend_central
