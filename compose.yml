services: 
  front: 
    build: 
      context: ./central_front/
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"

  backend: 
    build: 
      context: ./central/
      dockerfile: Dockerfile
    ports: 
      - "4000:4000"
    depends_on: 
      - db
    environment: 
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
  db: 
    image: postgres:18.4-alpine3.24
    container_name: postgres_db
    restart: always
    environment: 
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/

volumes: 
  postgres_data:

